<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Apex Labs | Race Comparison</title>
  <script>
    // Apply the saved (or system) theme before first paint to avoid a flash.
    try { document.documentElement.dataset.theme = localStorage.getItem("apex-theme") || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"); }
    catch (error) { document.documentElement.dataset.theme = "dark"; }
  </script>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-page="comparison" class="is-loading">
  <div class="app-shell">
    <aside class="sidebar" data-shell-nav></aside>
    <main class="content" data-page-root>
      <header class="page-header">
        <div><p class="eyebrow">Side-by-side analysis</p><h1>Race Comparison</h1><p>Compare any two Grands Prix, or trace the same event across two different seasons.</p></div>
        <button class="theme-toggle" type="button" data-theme-toggle aria-label="Toggle light and dark theme" title="Toggle theme">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </header>
      <section class="filter-bar" data-comparison-filters></section>
      <section class="comparison-labels" data-comparison-labels></section>
      <section class="kpi-grid" data-comparison-kpis></section>
      <section class="dashboard-grid">
        <article class="panel panel-large">
          <div class="panel-heading"><div><p class="eyebrow">Pace</p><h2>Driver average lap times</h2></div><div class="legend" data-legend="comparison-pace"></div></div>
          <div class="chart" data-chart="comparison-pace"></div>
        </article>
        <article class="panel">
          <div class="panel-heading"><div><p class="eyebrow">Race finish</p><h2>Classification profile</h2></div><div class="legend" data-legend="comparison-finish"></div></div>
          <div class="chart chart-compact" data-chart="comparison-finish"></div>
        </article>
        <article class="panel panel-wide">
          <div class="panel-heading"><div><p class="eyebrow">Constructor comparison</p><h2>Points earned by team</h2></div><div class="legend" data-legend="comparison-constructors"></div></div>
          <div class="chart" data-chart="comparison-constructors"></div>
        </article>
      </section>
    </main>
  </div>
  <script src="assets/js/vendor/d3.min.js"></script>
  <!-- data.js is written by scripts/build_data.py; it lets the pages open straight from disk. -->
  <script src="data/data.js"></script>
  <script src="assets/js/dashboard.js"></script>
</body>
</html>
